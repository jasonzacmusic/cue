# Builds Cue for Windows and Linux in the cloud (the Mac build is done by hand, signed and notarized).
# Runs on a version tag (v*) and on manual dispatch. Windows and Linux builds are NOT code-signed;
# their only proof of origin is cue-feed.json, signed here with the secret CUE_FEED_KEY (Ed25519,
# see scripts/feed-keygen.js) and verified by every copy of Cue with the key in src/main/update-core.js.
name: Build Windows and Linux

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-swap-probe:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Run the real swap script directly and through Node
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "cue probe's folders"
          $env:CUE_PROBE_ROOT = $root
          $env:CUE_PROBE_SCRIPT = (Resolve-Path ./src/main/win-swap.ps1).Path
          $winPS = Join-Path $env:SystemRoot "System32/WindowsPowerShell/v1.0/powershell.exe"
          $live = Join-Path $root Cue
          $staged = Join-Path $root Staged
          $report = Join-Path $root result.json
          New-Item -ItemType Directory -Force $live, $staged | Out-Null
          Set-Content -LiteralPath (Join-Path $staged marker.txt) 'new'
          & $winPS -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $env:CUE_PROBE_SCRIPT -WaitPid 2147483647 -Install $live -Staged $staged -Result $report -Version 1.1.0
          Write-Host "Direct invocation exit: $LASTEXITCODE"
          if (Test-Path -LiteralPath $report) { Get-Content -LiteralPath $report }
          @'
          const fs = require('node:fs');
          const path = require('node:path');
          const cp = require('node:child_process');
          const core = require('./src/main/update-core.js');
          const root = process.env.CUE_PROBE_ROOT;
          const live = path.join(root, 'NodeCue');
          const staged = path.join(root, 'NodeStaged');
          const result = path.join(root, 'node-result.json');
          fs.mkdirSync(live, { recursive: true });
          fs.mkdirSync(staged, { recursive: true });
          const run = (file, args, options) => {
            const probe = cp.spawnSync(file, ['-NoProfile', '-NonInteractive', '-Command', 'Write-Output "Node child ran"'], {
              ...options, timeout: 10000, encoding: 'utf8', stdio: 'pipe',
            });
            console.log('Node child:', JSON.stringify({ code: probe.status, error: probe.error?.message, stdout: probe.stdout, stderr: probe.stderr }));
            const swap = cp.spawnSync(file, args, { ...options, timeout: 10000, encoding: 'utf8', stdio: 'pipe' });
            console.log('Node swap:', JSON.stringify({ code: swap.status, error: swap.error?.message, stdout: swap.stdout, stderr: swap.stderr, report: core.readResult(result) }));
            return { unref() {} };
          };
          core.startWindowsSwap({ script: process.env.CUE_PROBE_SCRIPT, waitPid: 2147483647, live, staged, result, version: '1.1.0', spawnFn: run });
          '@ | node
