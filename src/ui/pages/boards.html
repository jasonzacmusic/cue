<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2032%2032%22%20fill%3D%22none%22%20stroke%3D%22%238A2F26%22%20stroke-width%3D%222.6%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Crect%20x%3D%225%22%20y%3D%225%22%20width%3D%229%22%20height%3D%2212%22%20rx%3D%222%22/%3E%3Crect%20x%3D%2218%22%20y%3D%225%22%20width%3D%229%22%20height%3D%227%22%20rx%3D%222%22/%3E%3Crect%20x%3D%2218%22%20y%3D%2216%22%20width%3D%229%22%20height%3D%2211%22%20rx%3D%222%22/%3E%3Crect%20x%3D%225%22%20y%3D%2221%22%20width%3D%229%22%20height%3D%226%22%20rx%3D%222%22/%3E%3C/svg%3E">
<title>Boards</title>
<link rel="stylesheet" href="pages.css">
<style>
.shell { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 22px; align-items: start; }
.side { position: sticky; top: 16px; display: flex; flex-direction: column; gap: 10px; }
.side-head h2 { white-space: nowrap; }
.side-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.blist { display: flex; flex-direction: column; gap: 4px; margin: 0; padding: 0; list-style: none; }
.blist button { width: 100%; display: flex; align-items: center; gap: 10px; text-align: left; border: 1px solid transparent; background: transparent; border-radius: 10px; padding: 8px 10px; cursor: pointer; }
.blist button:hover { background: var(--hover); }
.blist button[aria-current=true] { background: var(--raised); border-color: var(--line); box-shadow: 0 1px 2px var(--shadow); }
.blist .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.blist .ct { font-size: 12px; color: var(--muted); }
.stack { width: 34px; height: 34px; border-radius: 8px; background: var(--hover); flex: none; overflow: hidden; display: grid; place-items: center; color: var(--muted); font-size: 15px; }
.stack img { width: 100%; height: 100%; object-fit: cover; display: block; }
.newform { display: flex; gap: 6px; }
.main-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; min-height: 40px; }
.main-head h2.title { font-size: 22px; font-weight: 800; letter-spacing: 0; text-transform: none; color: var(--ink); margin: 0; }
.main-head input { font-size: 18px; font-weight: 700; max-width: 360px; }
.main-head .count { color: var(--muted); }
.main-head .sp { flex: 1; }
.grid { column-width: 220px; column-gap: 14px; }
.card { break-inside: avoid; margin: 0 0 14px; background: var(--raised); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: inline-block; width: 100%; }
.card .pic { display: block; width: 100%; border: 0; padding: 0; background: var(--hover); cursor: pointer; }
.card .pic img { display: block; width: 100%; height: auto; }
.card .meta { padding: 9px 11px 10px; display: flex; flex-direction: column; gap: 6px; }
.card .ttl { font-size: 13px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
.card .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.card .src { font-size: 12.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.card .nosrc { font-size: 12.5px; color: var(--onair-ink); font-weight: 600; }
.card .row .btn { flex: none; }
@media (max-width: 900px) { .shell { grid-template-columns: 190px minmax(0, 1fr); gap: 16px; } .grid { column-width: 180px; } }
@media (max-width: 620px) { .shell { grid-template-columns: 1fr; } .side { position: static; } }
</style>
</head>
<body>
<div class="page">
  <div class="head">
    <div>
      <h1>Boards</h1>
      <p>Pictures you collect while browsing, kept together by idea. Each one remembers the site it came from, so you can check who made it before you use it.</p>
    </div>
    <div class="sample-note" id="sampleNote" hidden>Showing sample pictures</div>
  </div>
  <div class="shell">
    <nav class="side" aria-label="Your boards">
      <div class="side-head"><h2>Your boards</h2><button class="btn small" id="newBtn" type="button">+ New board</button></div>
      <form class="newform" id="newForm" hidden>
        <input type="text" id="newName" placeholder="Name this board" maxlength="80" aria-label="Board name" autocomplete="off">
        <button class="btn primary small" type="submit">Create</button>
      </form>
      <ul class="blist" id="blist"></ul>
    </nav>
    <section id="main" aria-live="polite"></section>
  </div>
</div>
<script src="boards.js"></script>
</body>
</html>
