<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2032%2032%22%20fill%3D%22none%22%20stroke%3D%22%238A2F26%22%20stroke-width%3D%222.6%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M7%205v22M13%205v22M19%206l7%2021%22/%3E%3C/svg%3E">
<title>Library</title>
<link rel="stylesheet" href="pages.css">
<style>
.bar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
.tabs { display: inline-flex; background: var(--hover); border-radius: 10px; padding: 3px; gap: 2px; }
.tabs button { border: 0; background: transparent; padding: 7px 14px; border-radius: 8px; cursor: pointer; color: var(--muted); font-weight: 600; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected=true] { background: var(--raised); color: var(--ink); box-shadow: 0 1px 2px var(--shadow); }
.tabs .n { font-weight: 500; font-size: 12px; margin-left: 5px; opacity: .8; }
.search { flex: 1; min-width: 220px; max-width: 520px; }
.tools { margin-left: auto; display: flex; gap: 8px; }
.group { margin: 0 0 20px; }
.group > h2 { margin: 0 0 6px 2px; }
.rows { background: var(--raised); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin: 0; padding: 0; list-style: none; }
.row { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 8px 12px; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row:hover { background: var(--hover); }
.row .ic { width: 30px; height: 30px; border-radius: 8px; background: var(--bg); display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--muted); }
.row .tx { min-width: 0; }
.row .tx a { display: block; color: var(--ink); text-decoration: none; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .tx a:hover { color: var(--accent); text-decoration: underline; }
.row .u { display: block; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .meta { font-size: 12px; color: var(--muted); white-space: nowrap; display: flex; gap: 10px; align-items: center; }
.statusline { color: var(--muted); font-size: 12.5px; margin: 0 2px 10px; }
mark { background: var(--due-wash); color: inherit; border-radius: 3px; padding: 0 1px; }
@media (max-width: 700px) { .row { grid-template-columns: 30px minmax(0, 1fr); } .row .meta { grid-column: 2; } .tools { margin-left: 0; } }
</style>
</head>
<body>
<div class="page">
  <div class="head">
    <div>
      <h1>Library</h1>
      <p>Your saved pages, the pages you have visited, and tabs you put away.</p>
    </div>
    <div class="sample-note" id="sampleNote" hidden>Showing sample pages</div>
  </div>
  <div class="bar">
    <div class="tabs" role="tablist" aria-label="Library sections" id="tabs">
      <button role="tab" id="t-bookmarks" data-tab="bookmarks" aria-selected="true">Bookmarks<span class="n" id="n-bookmarks"></span></button>
      <button role="tab" id="t-history" data-tab="history" aria-selected="false">History<span class="n" id="n-history"></span></button>
      <button role="tab" id="t-archived" data-tab="archived" aria-selected="false">Archived<span class="n" id="n-archived"></span></button>
    </div>
    <input class="search" type="search" id="q" placeholder="Search this section" aria-label="Search this section" autocomplete="off">
    <div class="tools"><button class="btn danger" id="clearHist" type="button" hidden>Clear history</button></div>
  </div>
  <p class="statusline" id="status" aria-live="polite"></p>
  <div id="out" role="tabpanel"></div>
</div>
<script src="library.js"></script>
</body>
</html>
