<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src * data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Vanish</title>
<style>
  :root { --ink: #ECE9E4; --dim: #8E8A84; --line: #26262B; --face: #15151A; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 86px; overflow: hidden; background: #0B0B0D; color: var(--ink); font: 13px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; user-select: none; }
  #strip { height: 40px; display: flex; align-items: flex-end; gap: 4px; padding: 0 10px 0 82px; -webkit-app-region: drag; }
  body.flat #strip { padding-left: 10px; }
  #bar { height: 46px; display: flex; align-items: center; gap: 8px; padding: 0 12px; background: var(--face); border-bottom: 1px solid var(--line); }
  button, input { -webkit-app-region: no-drag; font: inherit; color: inherit; }
  .mark { width: 16px; height: 16px; border-radius: 50%; border: 1.5px dashed var(--dim); flex: none; }
  .nav { width: 28px; height: 28px; border: 0; background: none; border-radius: 7px; display: grid; place-items: center; color: var(--dim); cursor: pointer; }
  .nav:hover:not(:disabled) { background: var(--face); color: var(--ink); }
  .nav:disabled { opacity: .3; cursor: default; }
  .nav svg { width: 15px; height: 15px; }
  #url { flex: 1; min-width: 80px; height: 30px; border: 1px solid var(--line); border-radius: 15px; background: #0B0B0D; padding: 0 14px; outline: 0; user-select: text; }
  #url:focus { border-color: var(--dim); }
  #url::placeholder { color: var(--dim); }
  #tabs { display: flex; gap: 2px; min-width: 0; height: 34px; }
  .tab { flex: 0 1 220px; min-width: 42px; height: 34px; display: flex; align-items: center; gap: 8px; padding: 0 5px 0 10px; border-radius: 9px 9px 0 0; color: var(--dim); -webkit-app-region: no-drag; container-type: inline-size; }
  .tab:hover { background: #121216; }
  .tab.on { background: var(--face); color: var(--ink); }
  .tab img, .tab .dot { width: 14px; height: 14px; flex: none; border-radius: 3px; }
  .tab .dot { border-radius: 50%; border: 1.5px dashed var(--dim); }
  .tab.loading .dot { border-style: solid; border-right-color: transparent; animation: turn .8s linear infinite; }
  @keyframes turn { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .tab.loading .dot { animation: none; } }
  .tab .name { flex: 1; min-width: 0; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tab .x { width: 20px; height: 20px; flex: none; border: 0; border-radius: 5px; background: none; display: grid; place-items: center; color: var(--dim); opacity: 0; cursor: pointer; }
  .tab:hover .x, .tab.on .x { opacity: 1; }
  .tab .x:hover { background: var(--line); color: var(--ink); }
  .tab .x svg { width: 10px; height: 10px; }
  @container (max-width: 76px) { .tab .name { display: none; } .tab:not(.on):not(:hover) .x { display: none; } }
  #new { flex: none; margin-bottom: 3px; }
</style>
</head>
<body>
<div id="strip">
  <div id="tabs" role="tablist" aria-label="Vanish tabs"></div>
  <button id="new" class="nav" aria-label="New Vanish tab" title="New Vanish tab (⌘T)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg></button>
</div>
<div id="bar">
  <span class="mark" title="Vanish: nothing here is saved"></span>
  <button id="back" class="nav" aria-label="Back"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3 5 8l5 5"/></svg></button>
  <button id="fwd" class="nav" aria-label="Forward"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 3 5 5-5 5"/></svg></button>
  <button id="reload" class="nav" aria-label="Reload"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M13 8a5 5 0 1 1-1.5-3.5L13 6V2.5"/></svg></button>
  <input id="url" type="text" spellcheck="false" autocomplete="off" placeholder="Search or type an address. Nothing here is saved." aria-label="Address">
</div>
<script src="vanish.js"></script>
</body>
</html>
